<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Plans | CRYPTO HUB GROWTH INVESTMENT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:linear-gradient(135deg,#050b18,#071a33,#0b2a4a);
  color:#fff;
}

.brand{
  text-align:center;
  padding:18px;
  font-size:18px;
  font-weight:700;
  color:#00d9ff;
}

/* NOTIFY */
#notify{
  position:fixed;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  background:#00d9ff;
  color:#00131a;
  padding:12px 18px;
  border-radius:10px;
  font-weight:700;
  display:none;
  z-index:9999;
}

/* GRID */
.grid{
  padding:20px;
  display:grid;
  gap:12px;
}

/* PLAN CARD */
.plan{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:14px;
  padding:15px;
}

.plan h3{
  color:#9adfff;
  margin-bottom:6px;
}

.plan p{
  font-size:13px;
  color:#cfe8ff;
  margin:3px 0;
}

/* BUTTONS */
.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:700;
  margin-top:10px;
  cursor:pointer;
}

.invest{background:#00d9ff;color:#00131a;}
.claim{background:#00ff99;color:#001a10;}
.disabled{background:#555;color:#999;cursor:not-allowed;}

/* NAV */
.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:85px;
  background:#061528;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid rgba(255,255,255,0.1);
}

.nav a{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  color:#cfe8ff;
  font-size:15px;
  font-weight:600;
  min-width:65px;
}

.nav a .icon{font-size:28px;}
.nav a.active{color:#00d9ff;}

</style>
</head>

<body>

<div class="brand">CRYPTO HUB GROWTH INVESTMENT</div>

<div id="notify"></div>

<div class="grid" id="plans"></div>

<div style="height:90px"></div>

<!-- NAV -->
<div class="nav">
  <a href="dashboard.html"><span class="icon">🏠</span><span>Home</span></a>
  <a href="task.html"><span class="icon">📌</span><span>Task</span></a>
  <a href="team.html"><span class="icon">👥</span><span>Team</span></a>
  <a href="plans.html" class="active"><span class="icon">📊</span><span>Plans</span></a>
  <a href="profile.html"><span class="icon">👤</span><span>Profile</span></a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDoE3JXF_ggmLS_MNO0xYE0uykuAlj0Mdk",
  authDomain: "crypto-hub-growth-invest-9492c.firebaseapp.com",
  databaseURL: "https://crypto-hub-growth-invest-9492c-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "crypto-hub-growth-invest-9492c",
  storageBucket: "crypto-hub-growth-invest-9492c.firebasestorage.app",
  messagingSenderId: "946872117732",
  appId: "1:946872117732:web:c6ba0ca8c1510bf902bff1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const userId = localStorage.getItem("userId") ||
("user_" + Math.random().toString(36).slice(2));

localStorage.setItem("userId", userId);

/* ================= SETTINGS ================= */
const PLAN_AMOUNTS = {
  1: 3000, 2: 7000, 3: 12000, 4: 17000, 5: 80000,
  6: 100000, 7: 250000, 8: 400000, 9: 580000, 10: 750000
};

const CYCLE = 72 * 60 * 60 * 1000; // 72 hours
const MATURITY = 21 * 24 * 60 * 60 * 1000; // 21 days

/* ================= NOTIFY ================= */
function notify(msg){
  const box = document.getElementById("notify");
  box.innerText = msg;
  box.style.display = "block";
  clearTimeout(window.__ntf);
  window.__ntf = setTimeout(()=>box.style.display="none",2500);
}

/* ================= PROFIT ================= */
function profit(level){
  const base = PLAN_AMOUNTS[level];
  return base * (0.18 + level * 0.02);
}

/* ================= FORMAT ================= */
function format(ms){
  if(ms <= 0) return "READY";

  let s = Math.floor(ms/1000);
  let h = Math.floor(s/3600);
  let m = Math.floor((s%3600)/60);
  let sec = s%60;

  return `${h}h ${m}m ${sec}s`;
}

/* ================= RENDER FIX ================= */
function render(data = {}){

  const plansDiv = document.getElementById("plans");
  plansDiv.innerHTML = "";

  const now = Date.now();

  for(let i=1;i<=10;i++){

    const d = data[i] || {};
    const invested = d.invested || 0;
    const startTime = d.startTime || 0;
    const lastClaim = d.lastClaim || 0;

    let countdownText = "Not invested";

    // ✔ ONLY SHOW TIMER IF INVESTED
    if(invested > 0){
      const baseTime = lastClaim || startTime;
      const nextTime = baseTime + CYCLE;
      countdownText = format(nextTime - now);
    }

    const perCycle = profit(i);
    const total21 = perCycle * 7;

    const maturityText =
      invested > 0
      ? `${Math.max(0, Math.floor((MATURITY - (now - startTime)) / CYCLE))} cycles left (21 days)`
      : "No active investment";

    const card = document.createElement("div");
    card.className = "plan";

    card.innerHTML = `
      <h3>VIP LEVEL ${i}</h3>

      <p>Investment: KES ${PLAN_AMOUNTS[i]}</p>
      <p>Active: KES ${invested}</p>

      <p>Profit per 3 days: KES ${perCycle.toFixed(2)}</p>
      <p>Total after 21 days: KES ${total21.toFixed(2)}</p>

      <p style="color:#00d9ff">Next payout: ${countdownText}</p>
      <p style="color:#9adfff">Maturity: ${maturityText}</p>

      ${
        invested === 0
        ? `<button class="btn invest" onclick="invest(${i})">Invest Now</button>`
        : `<button class="btn claim" onclick="claim(${i})">Claim Profit</button>`
      }
    `;

    plansDiv.appendChild(card);
  }
}

/* ================= INVEST ================= */
function invest(level){

  const amount = PLAN_AMOUNTS[level];
  const ref = db.ref("users/"+userId);

  ref.once("value").then(snap=>{
    const data = snap.val() || {};
    const balance = data.mainBalance || 0;

    if(balance < amount){
      notify("Insufficient balance");
      return;
    }

    ref.child("mainBalance").set(balance - amount);

    db.ref("users/"+userId+"/plans/"+level).set({
      invested: amount,
      startTime: Date.now(),
      lastClaim: 0
    });

    notify("Investment successful");
  });
}

/* ================= CLAIM ================= */
function claim(level){

  const ref = db.ref("users/"+userId+"/plans/"+level);
  const userRef = db.ref("users/"+userId);

  ref.once("value").then(snap=>{

    const d = snap.val() || {};
    const last = d.lastClaim || d.startTime || 0;

    if(Date.now() - last < CYCLE){
      notify("Wait 72 hours");
      return;
    }

    const earned = profit(level);

    userRef.once("value").then(usnap=>{
      const u = usnap.val() || {};
      const total = u.totalEarnings || 0;

      userRef.child("totalEarnings").set(total + earned);

      ref.update({ lastClaim: Date.now() });

      notify("Profit added: KES " + earned.toFixed(2));
    });

  });
}

/* ================= LIVE SYNC ================= */
db.ref("users/"+userId+"/plans").on("value", snap=>{
  render(snap.val() || {});
});

</script>

</body>
</html>
