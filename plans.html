<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {
apiKey: "AIzaSyDoE3JXF_ggmLS_MNO0xYE0uykuAlj0Mdk",
authDomain: "crypto-hub-growth-invest-9492c.firebaseapp.com",
databaseURL: "https://crypto-hub-growth-invest-9492c-default-rtdb.europe-west1.firebasedatabase.app",
projectId: "crypto-hub-growth-invest-9492c",
storageBucket: "crypto-hub-growth-invest-9492c.firebasestorage.app",
messagingSenderId: "946872117732",
appId: "1:946872117732:web:c6ba0ca8c1510bf902bff1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const userId =
localStorage.getItem("userId") ||
("user_" + Math.random().toString(36).slice(2));

localStorage.setItem("userId", userId);

const PLAN_AMOUNTS = {
1:3000,
2:7000,
3:12000,
4:17000,
5:80000,
6:100000,
7:250000,
8:400000,
9:580000,
10:750000
};

const CYCLE = 72 * 60 * 60 * 1000;
const MATURITY = 21 * 24 * 60 * 60 * 1000;

let plansData = {};

function notify(msg){
const box = document.getElementById("notify");
box.innerText = msg;
box.style.display = "block";

clearTimeout(window.notifyTimer);

window.notifyTimer = setTimeout(()=>{
box.style.display="none";
},2500);
}

function profit(level){
const base = PLAN_AMOUNTS[level];
return base * (0.18 + level * 0.02);
}

function format(ms){

if(ms <= 0){
return "READY";
}

let total = Math.floor(ms/1000);

let days = Math.floor(total/86400);
let hours = Math.floor((total%86400)/3600);
let mins = Math.floor((total%3600)/60);
let secs = total%60;

return `${days}d ${hours}h ${mins}m ${secs}s`;
}

function render(data={}){

const plansDiv = document.getElementById("plans");
plansDiv.innerHTML = "";

const now = Date.now();

for(let i=1;i<=10;i++){

const plan = data[i] || {};

const invested = plan.invested || 0;
const startTime = plan.startTime || 0;
const lastClaim = plan.lastClaim || 0;

const perCycle = profit(i);
const total21 = perCycle * 7;

let countdownText = "Not invested";
let buttonHtml = `
<button class="btn invest"
onclick="invest(${i})">
Invest Now
</button>`;

let maturityText = "No active investment";

if(invested > 0){

const baseTime = lastClaim || startTime;
const nextClaim = baseTime + CYCLE;

countdownText = format(nextClaim - now);

const maturityRemaining =
Math.max(0, MATURITY - (now - startTime));

const cyclesLeft =
Math.ceil(maturityRemaining / CYCLE);

maturityText =
maturityRemaining > 0
? `${cyclesLeft} cycles left`
: "Matured";

if(now >= nextClaim){

buttonHtml = `
<button class="btn claim"
onclick="claim(${i})">
Claim Profit
</button>`;
}
else{

buttonHtml = `
<button class="btn disabled" disabled>
Claim Locked
</button>`;
}

}

const card = document.createElement("div");

card.className = "plan";

card.innerHTML = `
<h3>VIP LEVEL ${i}</h3>

<p>Investment: KES ${PLAN_AMOUNTS[i]}</p>

<p>Active Investment: KES ${invested}</p>

<p>Profit per 72 Hours: KES ${perCycle.toFixed(2)}</p>

<p>Total After 21 Days: KES ${total21.toFixed(2)}</p>

<p style="color:#00d9ff">
Next Payout: ${countdownText}
</p>

<p style="color:#9adfff">
Maturity: ${maturityText}
</p>

${buttonHtml}
`;

plansDiv.appendChild(card);

}

}

function invest(level){

const amount = PLAN_AMOUNTS[level];

const userRef = db.ref("users/"+userId);

userRef.once("value").then(snapshot=>{

const user = snapshot.val() || {};

const balance = user.mainBalance || 0;

if(balance < amount){
notify("Insufficient balance");
return;
}

userRef.child("mainBalance")
.transaction(current=>{
return (current || 0) - amount;
});

db.ref("users/"+userId+"/plans/"+level)
.set({
invested: amount,
startTime: Date.now(),
lastClaim: 0
});

notify("Investment successful");

});

}

function claim(level){

const planRef =
db.ref("users/"+userId+"/plans/"+level);

const userRef =
db.ref("users/"+userId);

planRef.once("value").then(snapshot=>{

const plan = snapshot.val();

if(!plan) return;

const last =
plan.lastClaim || plan.startTime;

if(Date.now() - last < CYCLE){
notify("Wait until countdown finishes");
return;
}

if(Date.now() - plan.startTime >= MATURITY){

userRef.child("mainBalance")
.transaction(balance=>{
return (balance || 0) + plan.invested;
});

planRef.remove();

notify("Investment matured. Capital returned.");

return;
}

const earned = profit(level);

userRef.child("totalEarnings")
.transaction(current=>{
return (current || 0) + earned;
});

planRef.update({
lastClaim: Date.now()
});

notify(
"Profit added: KES " +
earned.toFixed(2)
);

});

}

db.ref("users/"+userId+"/plans")
.on("value",snapshot=>{

plansData = snapshot.val() || {};

render(plansData);

});

setInterval(()=>{
render(plansData);
},1000);

</script>

</body>
